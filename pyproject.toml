[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentify"
version = "0.1.2"
description = "A contract for agent-operable repositories, a checker, and a converter"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agentify = "agentify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentify = ["templates/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Ruff 0.16+ lints and formats Python code blocks inside *.md by default. Docs hold illustrative snippets; the gate is about code.
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
# pyflakes (F) catches real defects; E, W, I, UP are mechanical. E501 is the
# formatter's job: it wraps what it can and leaves long literals alone.
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
